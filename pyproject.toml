[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-ii-da"
version = "0.1.0"
description = "Diff-II (DA variant)"
requires-python = ">=3.9,<3.11"

dependencies = [
    # Core
    "numpy",
    "tqdm",
    
    # Dev tools
    "ipdb",
    "flake8",
    "ipykernel",
    "pytest",
    "pytest-env",
    
    # PyTorch stack
    "torch>=1.11.0",
    "torchvision>=0.12.0",
    "xformers",
    
    # ML
    "wandb",
    "tensorboard",
    "transformers==4.36.2",
    "diffusers==0.25.1",
    "accelerate==0.25.0",
    "seaborn",
    "datasets",
    "open_clip_torch",
    "peft==0.7.1",
    "pytorch-warmup",
    "lpips",
    
    # HuggingFace
    "huggingface_hub==0.25.2",
    
    # Git deps
    "ImageNetV2-pytorch @ git+https://github.com/modestyachts/ImageNetV2_pytorch",
    "clip @ git+https://github.com/openai/CLIP.git",
    "cutmix @ git+https://github.com/ildoonet/cutmix.git",
]

[project.optional-dependencies]
dev = [
    "ipdb",
    "flake8",
    "pytest",
    "pytest-env",
]