[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-noise-generator"
version = "0.1.0"
description = "Extracting forward process noise using HuggingFace Diffusers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.8.0",
    "torchvision",
    "diffusers",
    "pillow"
]